# Ghouls'n Ghosts (Capcom 1988, CPS-1 arcade board): per-game settings read by the cps2recomp toolkit (Makefile,
# tools and launcher via tools/gamecfg.py). A first port: the game as the board plays it, translated, with its FM
# music and effects (this fork's YM2151), and no sources of its own yet.

# (no apostrophe or colon: the name is also the folder the player's settings are kept under)
name = Ghouls n Ghosts
# What the window is called (the name stays the folder the player's settings are kept under)
title = Ghouls n Ghosts Recomp
id = ghouls
app_id = io.github.tmcleroy.ghouls
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# ghouls is the World release, the parent set.
rom_set = ghouls
rom_parent = ghouls
rom_name = Ghouls'n Ghosts (World)

# The board: a classic CPS-1 with no QSound (machine/romset.h), its 68000 at 10 MHz (MAME's cps1_10MHz). Its
# CPS-B-01: layer control, the four priority masks, palette control, the layer enable bits (byte offsets, hex)
board = cps1-classic
cpu_clock = 10
cps_b = 26 28 2A 2C 2E 30 02 04 08
# Its graphics mapper (the PAL DM620, as MAME's table has it): banks of 8000, 2000 and 2000; scroll 3's tiles from
# 8000 in the second bank, objects 2000-3fff in the third, everything else in the first. The first row that matches
# is the one taken.
gfx_map = 8000 2000 2000 | scroll3:8000-bfff:1 objects:2000-3fff:2 objects:0-1ffff:0 scroll1:0-1ffff:0 scroll2:0-1ffff:0 scroll3:0-1ffff:0
# The DIP switches (banks A, B and C, hex), as the boards left the factory: 1 coin 1 credit, difficulty 2, a bonus life
# at 30K, 60K and every 70K, 3 lives, the demonstrations' sound, continues allowed
dip = FF FD FF

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs: two pairs of files giving the even and odd bytes (a+b), then a file of 16-bit words
# high byte first (/be). graphics: four files side by side (two bytes of the 64-bit words each), then two groups of
# eight joined files (a byte each). sound_program: the Z80's ROM. No samples: the board has no OKI ROMs, no voices.
program = dme_29.10h:166a58a2+dme_30.10j:7ac8407a dme_27.9h:f734b2be+dme_28.9j:03d3e714 dm-17.7j:3ea1b0f2/be
graphics = dm-05.3a:0ba9c0b0 dm-07.3f:5d760ab9 dm-06.3c:4ba90b59 dm-08.3g:4bdee9de 09.4a:ae24bb19+18.7a:d34e271a+13.4e:3f70dd37+22.7e:7e69e2e6+11.4c:37c9b6c6+20.7c:2f1345b4+15.4g:3c2a212a+24.7g:889aac05 10.4b:bcc0f28c+19.7b:2a40166a+14.4f:20f85c03+23.7f:8426144b+12.4d:da088d61+21.7d:17e11df0+16.4h:f187ba1c+25.7h:29f79c78
sound_program = 26.10a:3692f6e5
samples =

# Two players taking turns, and what the game calls its two buttons (the launcher's Controllers page shows these)
players = 2
buttons = Fire | Jump

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this (the whole program
# until made-up play shows where the code stops)
code_end = 100000
