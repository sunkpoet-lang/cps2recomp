#
# Hyper Street Fighter II: The Anniversary Edition (Capcom 2004, CPS-2 arcade board): per-game settings read by the
# cps2recomp toolkit (Makefile, tools and launcher via tools/gamecfg.py). A first port: the game as the board plays
# it, translated, with no sources of its own yet.

name = Hyper Street Fighter II
# What the window is called (the name stays the folder the player's settings are kept under)
title = Hyper Street Fighter II Recomp
id = hsf2
app_id = io.github.tmcleroy.hsf2
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# hsf2j is the Japanese 040202 revision; its parent hsf2 (USA 040202) holds the graphics and the sound.
rom_set = hsf2j
rom_parent = hsf2
rom_name = Hyper Street Fighter II: The Anniversary Edition (Japan 040202)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs (16-bit words). graphics: four files side by side per row (64-bit words), one row of
# 8 MB files. sound_program: the Z80's ROMs. samples: the QSound chip's. key: the board's cipher key.
program = hs2j.03c:6efe661f hs2j.04b:93f2500a hs2j.05:dde34a35 hs2j.06:f4e56dda hs2j.07:ee4420fc hs2j.08:c9441533 hs2j.09:3fc638a8 hs2j.10:20d0f9e4
graphics = hs2.13m:a6ecab17 hs2.15m:10a0ae4d hs2.17m:adfa7726 hs2.19m:bb3ae322
sound_program = hs2.01:c1a13786 hs2.02:2d8794aa
samples = hs2.11m:0e15c359
key = hsf2j.key:19455a93

# Made from much of Super Street Fighter II Turbo's program: its sources are built too (their places, where they are
# in this game, in family.h), but for the files below, which this game does without: the tag team battle, the model
# viewer, widescreen, custom colours and Super Turbo's hidden characters (its own game.cpp and music.cpp take the
# place of those of the same name)
sources = ssf2t
sources_leave_out = livetag.cpp model.cpp widescreen.cpp colours.cpp choosing.cpp

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this. Not known yet: the
# whole program until made-up play shows where the code stops
code_end = 400000
