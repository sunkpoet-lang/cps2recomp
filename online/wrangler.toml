# The introduction service for online play (online/README.md): `wrangler deploy` from this folder
name = "cps2recomp-online"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "MATCHES"
class_name = "Match"

[[durable_objects.bindings]]
name = "LOBBIES"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Match"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby"]

[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Stats"]

# (this fork, ForkAde's online-abuse-protection) The counts for hosting, joining and looking up a code
[[durable_objects.bindings]]
name = "LIMITS_COUNTER"
class_name = "Limits"

[[migrations]]
tag = "v5"
new_sqlite_classes = ["Limits"]

# (this fork, ForkAde's discord-community-lobby) Who may use the social layer, and the public lobby's chat
[[durable_objects.bindings]]
name = "MEMBERS"
class_name = "Members"

[[durable_objects.bindings]]
name = "COMMUNITY"
class_name = "Community"

[[migrations]]
tag = "v6"
new_sqlite_classes = ["Members", "Community"]

# Limits are only logged until this says "enforce" (online-abuse-protection's rollout: log first, then refuse)
[vars]
LIMITS = "log"

# (this fork, ForkAde's discord-community-lobby) The registration and admin pages, served as the Worker's static
# assets at /join and /admin, with site/_headers' headers. online/site is a copy of ForkAde's site/ (tools/sync-site.sh;
# --check in the checks). Paths that are not a file of it go to the Worker as before.
[assets]
directory = "./site"
html_handling = "auto-trailing-slash"
not_found_handling = "none"
